<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>APEX Delta Bars | Order Flow</title>
<style>
  :root{
    --bg-0:#070a10; --bg-1:#0d121b; --bg-2:#131a26; --line:#1e2733;
    --text-hi:#e7edf5; --text-mid:#8a97a8; --text-low:#526073;
    --buy:#2bd97c; --sell:#ff4d5e; --amber:#ffb020; --amber-dim:#5c4319;
    --blue:#4fc3ff; --grey:#9aa6b5;
    --mono:'IBM Plex Mono','Consolas',monospace; --sans:'Inter',-apple-system,sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  html,body{ width:100%; height:100%; background:var(--bg-0); color:var(--text-hi); font-family:var(--sans); overflow:hidden; }
  .app{ display:flex; flex-direction:column; height:100vh; }

  .topbar{ display:flex; align-items:center; gap:10px; height:44px; padding:0 12px; background:var(--bg-1); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .brand{ font-weight:700; font-size:13px; display:flex; align-items:center; gap:6px; }
  .brand .dot{ width:7px; height:7px; border-radius:50%; background:var(--buy); box-shadow:0 0 8px var(--buy); animation:pulse 1.6s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  select, .ctl-btn{ background:var(--bg-2); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font-family:var(--mono); font-size:12px; color:var(--text-hi); cursor:pointer; }
  .tf-group{ display:flex; gap:2px; background:var(--bg-2); border:1px solid var(--line); border-radius:6px; padding:2px; }
  .tf-btn{ font-family:var(--mono); font-size:11px; color:var(--text-mid); background:transparent; border:none; padding:6px 9px; border-radius:4px; cursor:pointer; }
  .tf-btn.active{ background:var(--amber-dim); color:var(--amber); }
  .spacer{ flex:1; }
  .status{ font-family:var(--mono); font-size:10.5px; color:var(--text-low); display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .status .sp{ width:6px; height:6px; border-radius:50%; background:var(--amber); }
  .status.live .sp{ background:var(--buy); }

  .infoline{ font-family:var(--mono); font-size:11px; color:var(--text-mid); padding:6px 14px; background:var(--bg-1); border-bottom:1px solid var(--line); display:flex; gap:16px; flex-wrap:wrap; }
  .infoline b{ color:var(--text-hi); }

  .chart-wrap{ flex:1; position:relative; min-height:0; }
  #chart{ width:100%; height:100%; display:block; }
  .loading{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; background:rgba(7,10,16,0.88); font-family:var(--mono); color:var(--text-mid); font-size:12px; z-index:5; }
  .loading .bar{ width:220px; height:4px; background:var(--bg-2); border-radius:2px; overflow:hidden; }
  .loading .bar-fill{ height:100%; background:var(--amber); width:0%; transition:width .2s; }

  .stats-wrap{ display:flex; border-top:1px solid var(--line); background:var(--bg-1); flex-shrink:0; height:150px; }
  .stats-scroll{ flex:1; overflow-x:auto; overflow-y:hidden; }
  .stats-table{ display:flex; height:100%; }
  .stats-col{ width:105px; flex-shrink:0; border-right:1px solid rgba(255,255,255,0.03); }
  .stats-labels{ width:100px; flex-shrink:0; }
  .stat-cell{ height:30px; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:11px; font-weight:600; border-bottom:1px solid rgba(255,255,255,0.03); }
  .stat-label{ height:30px; display:flex; align-items:center; padding-left:8px; font-family:var(--sans); font-size:10.5px; color:var(--text-mid); border-bottom:1px solid rgba(255,255,255,0.03); }

  ::-webkit-scrollbar{ height:7px; width:7px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }
  ::-webkit-scrollbar-track{ background:transparent; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><span class="dot"></span>APEX DELTA BARS</div>
    <select id="symSelect">
      <option value="BTCUSDT">BTCUSDT</option>
      <option value="ETHUSDT">ETHUSDT</option>
      <option value="SOLUSDT">SOLUSDT</option>
      <option value="XRPUSDT">XRPUSDT</option>
      <option value="BNBUSDT">BNBUSDT</option>
      <option value="DOGEUSDT">DOGEUSDT</option>
    </select>
    <div class="tf-group" id="tfGroup">
      <button class="tf-btn" data-tf="1m">1m</button>
      <button class="tf-btn" data-tf="5m">5m</button>
      <button class="tf-btn active" data-tf="15m">15m</button>
      <button class="tf-btn" data-tf="1h">1h</button>
    </div>
    <button class="ctl-btn" id="refreshBtn">⟲ Refresh</button>
    <div class="spacer"></div>
    <div class="status" id="statusEl"><span class="sp"></span>connecting…</div>
  </div>

  <div class="infoline" id="infoLine">
    <span>Symbol <b id="infoSym">—</b></span>
    <span>O <b id="infoO">—</b></span>
    <span>H <b id="infoH">—</b></span>
    <span>L <b id="infoL">—</b></span>
    <span>C <b id="infoC">—</b></span>
    <span>V <b id="infoV">—</b></span>
    <span style="color:var(--text-low)">Real Binance klines + aggTrades — delta from taker buy/sell side</span>
  </div>

  <div class="chart-wrap">
    <canvas id="chart"></canvas>
    <div class="loading" id="loadingEl">
      <div>Fetching real market + trade data from Binance…</div>
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      <div id="loadingSub" style="font-size:10.5px;color:var(--text-low);"></div>
    </div>
  </div>

  <div class="stats-wrap">
    <div class="stats-labels">
      <div class="stat-label">Delta</div>
      <div class="stat-label">Max Delta</div>
      <div class="stat-label">Min Delta</div>
      <div class="stat-label">Delta Chg</div>
      <div class="stat-label">Volume</div>
    </div>
    <div class="stats-scroll" id="statsScroll">
      <div class="stats-table" id="statsTable"></div>
    </div>
  </div>
</div>

<script>
/* =============================================================
   REAL DELTA-BAR CHART — data source: Binance public API
   - OHLC candles:  /api/v3/klines   (exact exchange O/H/L/C/V)
   - Trade prints:  /api/v3/aggTrades (paginated per candle)
     isBuyerMaker=true  -> taker SOLD  (aggressive sell)
     isBuyerMaker=false -> taker BOUGHT (aggressive buy)
   - Live updates via wss aggTrade stream for the forming candle
============================================================= */
const REST = 'https://api.binance.com/api/v3';
let symbol = 'BTCUSDT';
let interval = '15m';
const LOOKBACK = 20;
const MAX_PAGES_PER_CANDLE = 5;

let candles = [];    // {time,open,high,low,close,vol}
let stats = [];      // per-candle {delta,maxDelta,minDelta,volume}
let ws = null;
let dpr = window.devicePixelRatio || 1;

const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('statusEl');
const loadingEl = document.getElementById('loadingEl');
const barFill = document.getElementById('barFill');
const loadingSub = document.getElementById('loadingSub');

function intervalMs(iv){ return {'1m':60000,'5m':300000,'15m':900000,'1h':3600000}[iv]; }

function resize(){
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width*dpr; canvas.height = rect.height*dpr;
  canvas.style.width = rect.width+'px'; canvas.style.height = rect.height+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
window.addEventListener('resize', resize);

async function fetchKlines(){
  const res = await fetch(`${REST}/klines?symbol=${symbol}&interval=${interval}&limit=${LOOKBACK}`);
  const raw = await res.json();
  return raw.map(k=>({ time:k[0], open:+k[1], high:+k[2], low:+k[3], close:+k[4], vol:+k[5] }));
}

async function fetchAggTradesRange(startTime, endTime){
  let out = []; let st = startTime;
  for(let page=0; page<MAX_PAGES_PER_CANDLE; page++){
    const res = await fetch(`${REST}/aggTrades?symbol=${symbol}&startTime=${st}&endTime=${endTime}&limit=1000`);
    if(!res.ok) break;
    const batch = await res.json();
    if(!batch.length) break;
    out = out.concat(batch);
    if(batch.length<1000) break;
    st = batch[batch.length-1].T+1;
    if(st>endTime) break;
  }
  return out;
}

function classify(trades){
  trades.sort((a,b)=>a.T-b.T);
  let running=0, maxD=-Infinity, minD=Infinity, buy=0, sell=0, vol=0;
  trades.forEach(t=>{
    const qty=+t.q, isSell = t.m===true;
    if(isSell){ sell+=qty; running-=qty; } else { buy+=qty; running+=qty; }
    vol+=qty; maxD=Math.max(maxD,running); minD=Math.min(minD,running);
  });
  if(trades.length===0){ maxD=0; minD=0; }
  return { delta:buy-sell, maxDelta:maxD===-Infinity?0:maxD, minDelta:minD===Infinity?0:minD, volume:vol, buy, sell };
}

async function loadAll(){
  loadingEl.style.display='flex'; barFill.style.width='5%';
  statusEl.className='status'; statusEl.innerHTML='<span class="sp"></span>loading candles…';
  try{ candles = await fetchKlines(); }
  catch(e){ loadingSub.textContent='Failed: '+e.message; return; }

  stats = new Array(candles.length);
  for(let i=0;i<candles.length;i++){
    barFill.style.width = (10+(i/candles.length)*85)+'%';
    loadingSub.textContent = `Candle ${i+1}/${candles.length} — pulling real trade prints…`;
    const endT = i===candles.length-1 ? Date.now() : candles[i+1].time-1;
    const trades = await fetchAggTradesRange(candles[i].time, endT);
    stats[i] = classify(trades);
  }
  barFill.style.width='100%';
  loadingEl.style.display='none';
  renderStatsTable();
  draw();
  updateInfo();
}

function fmtVol(v){ if(v>=1000) return (v/1000).toFixed(1)+'k'; return v.toFixed(v<10?2:1); }

function draw(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.clearRect(0,0,w,h);
  if(!candles.length) return;

  const padL=8, padR=64, padTop=54, padBot=10;
  const maxP = Math.max(...candles.map(c=>c.high));
  const minP = Math.min(...candles.map(c=>c.low));
  const plotW = w-padL-padR, plotH = h-padTop-padBot;
  const cw = plotW/candles.length;
  const yFor = p => padTop + (1-(p-minP)/(maxP-minP))*plotH;

  // grid
  ctx.strokeStyle='rgba(255,255,255,0.035)'; ctx.lineWidth=1;
  for(let i=0;i<=6;i++){ const y=padTop+(plotH*i/6); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w-padR,y); ctx.stroke(); }

  candles.forEach((c,i)=>{
    const st = stats[i];
    const x = padL + i*cw + cw/2;
    const bw = Math.min(cw*0.62, 46);

    // color by delta sign (with grey band near zero) — matches ATAS-style delta boxes
    const dNorm = st.delta;
    let col;
    if(Math.abs(dNorm) < Math.max(3, st.volume*0.06)) col = '#8a97a8';
    else if(dNorm>0) col = '#2bd97c';
    else col = '#ff4d5e';

    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1.4;

    // wick (high-low)
    ctx.beginPath(); ctx.moveTo(x, yFor(c.high)); ctx.lineTo(x, yFor(c.low)); ctx.stroke();
    // open tick (left)
    ctx.beginPath(); ctx.moveTo(x-bw/2, yFor(c.open)); ctx.lineTo(x, yFor(c.open)); ctx.stroke();
    // close tick (right)
    ctx.beginPath(); ctx.moveTo(x, yFor(c.close)); ctx.lineTo(x+bw/2, yFor(c.close)); ctx.stroke();
    // faint body box (like the reference image's boxed candle)
    ctx.globalAlpha = 0.08;
    ctx.fillRect(x-bw/2, yFor(Math.max(c.open,c.close)), bw, Math.max(Math.abs(yFor(c.open)-yFor(c.close)),2));
    ctx.globalAlpha = 1;
    ctx.strokeRect(x-bw/2, yFor(c.high), bw, yFor(c.low)-yFor(c.high));

    // labels above
    ctx.textAlign = 'center';
    ctx.font = 'bold 12px IBM Plex Mono, monospace';
    ctx.fillStyle = 'var(--blue)'.includes('var')? '#4fc3ff' : '#4fc3ff';
    ctx.fillText(fmtVol(st.volume), x, padTop-24);
    ctx.font = 'bold 11px IBM Plex Mono, monospace';
    ctx.fillStyle = st.delta>=0 ? '#2bd97c' : '#ff4d5e';
    ctx.fillText((st.delta>=0?'+':'')+st.delta.toFixed(0), x, padTop-9);
  });

  // right price axis
  ctx.fillStyle='#526073'; ctx.font='10px IBM Plex Mono, monospace'; ctx.textAlign='left';
  for(let i=0;i<=8;i++){
    const p = minP + (maxP-minP)*(i/8);
    ctx.fillText(p.toFixed(p<10?4:1), w-padR+8, yFor(p)+3);
  }

  // last price line
  const last = candles[candles.length-1];
  const ly = yFor(last.close);
  const lastCol = stats[stats.length-1].delta>=0 ? '#2bd97c' : '#ff4d5e';
  ctx.strokeStyle = lastCol; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(0,ly); ctx.lineTo(w-padR,ly); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = lastCol; ctx.fillRect(w-padR, ly-8, padR, 16);
  ctx.fillStyle='#04140b'; ctx.font='bold 10px IBM Plex Mono, monospace';
  ctx.fillText(last.close.toFixed(last.close<10?4:1), w-padR+4, ly+3);

  // bottom-right symbol/time label
  ctx.fillStyle='#526073'; ctx.font='11px IBM Plex Mono, monospace'; ctx.textAlign='right';
  const d = new Date(last.time);
  const hh = String(d.getUTCHours()).padStart(2,'0'), mm=String(d.getUTCMinutes()).padStart(2,'0');
  ctx.fillText(`${symbol}, ${interval}  ${hh}:${mm}`, w-padR-8, h-14);
}

function renderStatsTable(){
  const statsTable = document.getElementById('statsTable');
  statsTable.innerHTML='';
  candles.forEach((c,i)=>{
    const st = stats[i];
    const prevDelta = i>0 ? stats[i-1].delta : 0;
    const dChange = st.delta - prevDelta;
    const col = document.createElement('div'); col.className='stats-col';
    const rows = [
      {v:st.delta, colorize:true},
      {v:st.maxDelta, colorize:false},
      {v:st.minDelta, colorize:false},
      {v:dChange, colorize:true},
      {v:st.volume, colorize:false, plain:true}
    ];
    rows.forEach(cfg=>{
      const cell = document.createElement('div'); cell.className='stat-cell';
      cell.textContent = cfg.plain ? fmtVol(cfg.v) : (cfg.v>=0?'+':'')+cfg.v.toFixed(1);
      if(cfg.colorize){
        cell.style.background = cfg.v>=0 ? 'rgba(43,217,124,0.18)' : 'rgba(255,77,94,0.18)';
        cell.style.color = cfg.v>=0 ? '#2bd97c' : '#ff4d5e';
      } else if(!cfg.plain){
        cell.style.color = '#8a97a8';
      }
      col.appendChild(cell);
    });
    statsTable.appendChild(col);
  });
  const statsScroll = document.getElementById('statsScroll');
  statsScroll.scrollLeft = statsScroll.scrollWidth;
}

function updateInfo(){
  const last = candles[candles.length-1];
  document.getElementById('infoSym').textContent = symbol;
  document.getElementById('infoO').textContent = last.open.toFixed(2);
  document.getElementById('infoH').textContent = last.high.toFixed(2);
  document.getElementById('infoL').textContent = last.low.toFixed(2);
  document.getElementById('infoC').textContent = last.close.toFixed(2);
  document.getElementById('infoV').textContent = fmtVol(last.vol);
}

/* ---- live: stream real trades into the forming candle ---- */
function connectWS(){
  if(ws){ try{ ws.close(); }catch(e){} }
  statusEl.className='status'; statusEl.innerHTML='<span class="sp"></span>connecting…';
  ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@aggTrade`);
  ws.onopen = ()=>{ statusEl.className='status live'; statusEl.innerHTML='<span class="sp"></span>live trade stream'; };
  ws.onclose = ()=>{ statusEl.className='status'; statusEl.innerHTML='<span class="sp"></span>reconnecting…'; setTimeout(connectWS,2000); };
  ws.onerror = ()=> ws.close();
  ws.onmessage = (msg)=>{
    const t = JSON.parse(msg.data);
    const lastCandle = candles[candles.length-1];
    const boundary = lastCandle.time + intervalMs(interval);
    if(t.T >= boundary){ loadAll().then(connectWS); return; }
    const price=+t.p, qty=+t.q, isSell = t.m===true;
    const st = stats[stats.length-1];
    if(isSell) st.sell+=qty; else st.buy+=qty;
    st.delta = st.buy-st.sell; st.volume+=qty;
    st.maxDelta = Math.max(st.maxDelta, st.delta);
    st.minDelta = Math.min(st.minDelta, st.delta);
    lastCandle.close = price;
    lastCandle.high = Math.max(lastCandle.high, price);
    lastCandle.low = Math.min(lastCandle.low, price);
    lastCandle.vol += qty;
    draw(); updateInfo();
    // live-update just the last stats column value without full rebuild
    const cells = document.querySelectorAll('.stats-col:last-child .stat-cell');
    if(cells.length){
      cells[0].textContent = (st.delta>=0?'+':'')+st.delta.toFixed(1);
      cells[0].style.background = st.delta>=0?'rgba(43,217,124,0.18)':'rgba(255,77,94,0.18)';
      cells[0].style.color = st.delta>=0?'#2bd97c':'#ff4d5e';
      cells[1].textContent = (st.maxDelta>=0?'+':'')+st.maxDelta.toFixed(1);
      cells[2].textContent = (st.minDelta>=0?'+':'')+st.minDelta.toFixed(1);
      cells[4].textContent = fmtVol(st.volume);
    }
  };
}

document.querySelectorAll('.tf-btn').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('.tf-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); interval = b.dataset.tf;
    loadAll().then(connectWS);
  };
});
document.getElementById('symSelect').onchange = (e)=>{ symbol=e.target.value; loadAll().then(connectWS); };
document.getElementById('refreshBtn').onclick = ()=> loadAll().then(connectWS);

resize();
loadAll().then(connectWS);
</script>
</body>
</html>
